<meta charset="utf-8">
<title>Four outcomes</title>
<style>
  @font-face { font-family: 'Manrope'; src: url('{{BASE}}/fonts/manrope-latin.woff2') format('woff2'); font-weight: 200 800; font-display: block; }
  :root { --dark: #101014; --mint: #6ff2c1; }
  html, body { margin: 0; height: 100%; background: var(--dark); }
  body { display: grid; place-content: center; font-family: 'Manrope', system-ui, sans-serif; color: #fff; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { font-weight: 800; font-size: 92px; letter-spacing: -.025em; line-height: 1.28; opacity: 0; animation: rise .7s cubic-bezier(.22,.61,.36,1) forwards; }
  li b { color: var(--mint); font-weight: 800; }
  li:nth-child(1) { animation-delay: .2s; }
  li:nth-child(2) { animation-delay: 1.1s; }
  li:nth-child(3) { animation-delay: 2.0s; }
  li:nth-child(4) { animation-delay: 2.9s; }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
</style>
<ul>
  <li>Greater <b>revenue</b></li>
  <li>Higher performing <b>talent</b></li>
  <li>Streamlined <b>operations</b></li>
  <li>A culture that <b>innovates</b></li>
</ul>
